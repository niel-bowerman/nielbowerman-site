<main>
<section class="hero page-hero">
  <img class="hero-img" src="images/contact-poster.jpg?v=202610230000" alt="" style="object-position:50% 25%">
  <video class="hero-clip" style="object-position:50% 25%" src="video/contact-sd.mp4?v=202610230000" data-hd="video/contact.mp4?v=202610230000" poster="images/contact-poster.jpg?v=202610230000" autoplay muted loop playsinline preload="auto" data-speed="0.75" data-loop-from="1" aria-hidden="true" tabindex="-1"></video>
  <div class="page-hero-text">
    <h1>Get in touch</h1>
  </div>
</section>
<section class="sec-contact"><div class="form">
  <p class="intro">Feel free to fill out the form below to get in touch.</p>
  <form id="contact-form">
    <fieldset class="group">
      <legend>Name <span class="sub">(required)</span></legend>
      <div class="pair name-pair">
        <label class="field"><span class="sub">First Name</span><input type="text" name="first" required autocomplete="given-name"></label>
        <label class="field"><span class="sub">Last Name</span><input type="text" name="last" required autocomplete="family-name"></label>
      </div>
    </fieldset>
    <div class="group"><label class="field"><span class="lbl">Email Address <span class="sub">(required)</span></span><input type="email" name="email" required autocomplete="email"></label></div>
    <fieldset class="group">
      <legend>Phone <span class="sub">(optional)</span></legend>
      <div class="pair phone-pair">
        <label class="field"><span class="sub">Country</span>
          <select name="country">
            <option value="+44">United Kingdom (+44)</option>
            <option value="+1">United States (+1)</option>
            <option value="+1">Canada (+1)</option>
            <option value="+61">Australia (+61)</option>
            <option value="+353">Ireland (+353)</option>
            <option value="+49">Germany (+49)</option>
            <option value="+33">France (+33)</option>
            <option value="+31">Netherlands (+31)</option>
            <option value="+91">India (+91)</option>
          </select></label>
        <label class="field"><span class="sub">Number</span><input type="tel" name="number" autocomplete="tel-national"></label>
      </div>
    </fieldset>
    <div class="group"><label class="field"><span class="lbl">Subject <span class="sub">(required)</span></span><input type="text" name="subject" required></label></div>
    <div class="group"><label class="field"><span class="lbl">Message <span class="sub">(required)</span></span><textarea name="message" required></textarea></label></div>
    <button class="submit" type="submit">Submit</button>
    <p class="note" id="form-note">Your email app should have opened with the message ready to send.</p>
  </form>
</div></section>
</main>
